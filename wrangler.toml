# Florida State Roleplay Cloudflare Pages configuration
# Kept from the working V3 backup.
name = "florida-state-roleplay"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[[kv_namespaces]]
binding = "SITE_SETTINGS"
id = "d5253d8c54c54cb19f08b3bc3b61e90e"

# The integrated CAD automatically stores its data under a separate key in
# SITE_SETTINGS. A separate CAD_STATE binding is optional, not required.

# Optional R2 media storage. Uncomment only after creating the bucket.
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "fsrp-media"

# Encrypted Production secrets used by CAD/ER:LC integration:
# CAD_OCSO_CODE
# ERLC_SERVER_KEY
# Keep secret values in Cloudflare, never in this file.

# Staff Operations automatically stores records under a separate key in
# SITE_SETTINGS. A separate STAFF_STATE KV binding is optional, not required.
# Permanent evidence screenshots use the optional MEDIA_BUCKET R2 binding.
# Access codes and webhook URLs must remain Cloudflare encrypted secrets.

# Staff Command Suite stores data under fsrp_command_suite_v1 in SITE_SETTINGS.
# No new KV namespace is required.
# Optional encrypted Production secrets:
# DISCORD_WATCHDOG_WEBHOOK
# DISCORD_K9_WEBHOOK
# WATCHDOG_CRON_TOKEN
# WATCHDOG_AUTO_BAN_ENABLED
# WATCHDOG_AUTO_BAN_THRESHOLD
# The separate cron Worker uses wrangler.watchdog.example.toml.
